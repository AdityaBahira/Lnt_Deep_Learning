apiVersion: v1
kind: Namespace
metadata:
  name: dl-clinical-app
  labels:
    app.kubernetes.io/name: dl-clinical-system
    app.kubernetes.io/part-of: deep-learning-deployment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dl-app-config
  namespace: dl-clinical-app
  labels:
    app.kubernetes.io/name: dl-app-config
data:
  BACKEND_API_URL: "http://backend-svc:5000"
  PORT: "5000"
  STREAMLIT_SERVER_PORT: "8501"
  ENVIRONMENT: "kubernetes-cluster"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dl-backend-deployment
  namespace: dl-clinical-app
  labels:
    app: dl-backend
    tier: api
    app.kubernetes.io/name: dl-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dl-backend
      tier: api
  template:
    metadata:
      labels:
        app: dl-backend
        tier: api
    spec:
      containers:
      - name: dl-backend-api
        image: adityabahira/dl-clinical-backend:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http-api
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: dl-app-config
              key: PORT
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: dl-app-config
              key: ENVIRONMENT
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: dl-clinical-app
  labels:
    app: dl-backend
    tier: api
spec:
  type: ClusterIP
  selector:
    app: dl-backend
    tier: api
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dl-frontend-deployment
  namespace: dl-clinical-app
  labels:
    app: dl-frontend
    tier: ui
    app.kubernetes.io/name: dl-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dl-frontend
      tier: ui
  template:
    metadata:
      labels:
        app: dl-frontend
        tier: ui
    spec:
      containers:
      - name: dl-frontend-ui
        image: adityabahira/dl-clinical-frontend:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: http-ui
        env:
        - name: BACKEND_API_URL
          valueFrom:
            configMapKeyRef:
              name: dl-app-config
              key: BACKEND_API_URL
        - name: STREAMLIT_SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: dl-app-config
              key: STREAMLIT_SERVER_PORT
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "800m"
            memory: "1024Mi"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 20
          periodSeconds: 25
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dl-clinical-app
  labels:
    app: dl-frontend
    tier: ui
spec:
  type: NodePort
  selector:
    app: dl-frontend
    tier: ui
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30001
    protocol: TCP
    name: http-ui
