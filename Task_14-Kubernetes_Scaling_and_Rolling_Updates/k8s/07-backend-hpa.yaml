apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dl-backend-hpa
  namespace: dl-production-app
  labels:
    app: dl-backend
    task: "14"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dl-backend-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
