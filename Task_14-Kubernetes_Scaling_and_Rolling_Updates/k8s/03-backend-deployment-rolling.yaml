apiVersion: apps/v1
kind: Deployment
metadata:
  name: dl-backend-deployment
  namespace: dl-production-app
  labels:
    app: dl-backend
    tier: api
    app.kubernetes.io/name: dl-backend
    app.kubernetes.io/part-of: dl-clinical-suite
    task: "14"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dl-backend
      tier: api
  template:
    metadata:
      labels:
        app: dl-backend
        tier: api
        version: "v1.0"
    spec:
      containers:
      - name: dl-backend-api
        image: adityabahira/dl-clinical-backend:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http-api
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: dl-production-config
              key: PORT
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: dl-production-config
              key: ENVIRONMENT
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: dl-production-config
              key: MODEL_NAME
        - name: MODEL_FRAMEWORK
          valueFrom:
            configMapKeyRef:
              name: dl-production-config
              key: MODEL_FRAMEWORK
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
