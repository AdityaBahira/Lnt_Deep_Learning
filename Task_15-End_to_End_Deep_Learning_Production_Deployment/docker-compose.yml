services:
  # PyTorch Deep Learning Flask REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: adityabahira/dl-production-backend:v1.0
    container_name: dl-production-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dl-production-network

  # Streamlit Medical Web Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: adityabahira/dl-production-frontend:v1.0
    container_name: dl-production-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:5000
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dl-production-network

networks:
  dl-production-network:
    driver: bridge
