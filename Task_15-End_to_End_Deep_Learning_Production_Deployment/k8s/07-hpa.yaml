apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dl-backend-hpa
  namespace: dl-production-app
  labels:
    app: dl-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dl-backend-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
