apiVersion: v1
kind: Service
metadata:
  name: dl-backend-svc
  namespace: dl-production-app
  labels:
    app: dl-backend
    tier: api
spec:
  type: NodePort
  selector:
    app: dl-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
